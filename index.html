<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyGlot - Aprende Inglés y Hebreo</title>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --accent: #06b6d4;
            --success: #10b981;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            --radius: 16px;
        }

        [data-theme="dark"] {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #22d3ee;
            --success: #34d399;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .logo-area h1 {
            font-size: 1.4rem;
            color: var(--primary);
            font-weight: 700;
        }

        .logo-area p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            font-size: 1rem;
        }

        /* Language Switcher */
        .selectors {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .lang-btn {
            flex: 1;
            padding: 14px;
            border: 2px solid var(--border);
            background: var(--card-bg);
            color: var(--text-main);
            font-weight: 700;
            font-size: 1rem;
            border-radius: var(--radius);
            cursor: pointer;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .lang-btn:hover {
            transform: translateY(-2px);
        }

        .lang-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Nav Modules */
        .nav-modules {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .module-tab {
            padding: 8px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .module-tab.active {
            color: var(--primary);
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.08);
            transform: scale(1.03);
        }

        /* ANIMACIÓN DE ENTRADA PARA LA TARJETA */
        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Card Container */
        .study-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 20px;
            animation: fadeInSlide 0.35s ease-out;
        }

        .card-block {
            padding: 14px;
            border-radius: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border);
        }

        .card-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card-value-spanish {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--success);
        }

        .card-value-main {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .card-value-main.hebrew {
            font-family: 'Frank Ruhl Libre', serif;
            font-size: 2.8rem;
            direction: rtl;
        }

        .card-value-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body data-theme="light">

    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo-area">
                <h1>PolyGlot 🌐</h1>
                <p>Estudio Animado y Ordenado</p>
            </div>
            <button class="icon-btn" id="themeToggle" title="Cambiar Tema">🌙</button>
        </header>

        <!-- Selector de Idioma Principal -->
        <div class="selectors">
            <button class="lang-btn active" data-lang="en">🇬🇧 Inglés</button>
            <button class="lang-btn" data-lang="he">🇮🇱 Hebreo</button>
        </div>

        <!-- Navegación por Módulos -->
        <div class="nav-modules" id="moduleNav"></div>

        <!-- Tarjeta de Estudio Animada -->
        <div class="study-card" id="studyCard">
            <!-- Bloque 1: Significado en Español -->
            <div class="card-block">
                <div class="card-label">1. Significado en Español</div>
                <div class="card-value-spanish" id="wordSpanish">Ejecutar / Correr</div>
            </div>

            <!-- Bloque 2: Escritura Original -->
            <div class="card-block">
                <div class="card-label">2. Escritura Original</div>
                <div class="card-value-main" id="wordOriginal">Run</div>
            </div>

            <!-- Bloque 3: Pronunciación -->
            <div class="card-block">
                <div class="card-label">3. Pronunciación (Cómo se lee)</div>
                <div class="card-value-text" id="wordPhonetic">/ran/</div>
            </div>

            <!-- Bloque 4: Ejemplo práctico -->
            <div class="card-block" style="margin-top: -8px;">
                <div class="card-label">Ejemplo de Uso en Oración</div>
                <div class="card-value-text" id="wordExample" style="font-style: italic; font-size: 0.95rem; color: var(--text-muted);">
                    "Run the script in terminal."
                </div>
            </div>
        </div>

        <!-- Botones de Control -->
        <div class="controls">
            <button class="btn btn-secondary" id="prevBtn">⬅️ Anterior</button>
            <button class="btn btn-primary" id="speakBtn">🔊 Escuchar Pronunciación</button>
            <button class="btn btn-secondary" id="nextBtn">Siguiente ➡️</button>
        </div>
    </div>

    <script>
        const database = {
            en: {
                name: "Inglés",
                modules: [
                    {
                        name: "Verbos de Código & Programación",
                        cards: [
                            { spanish: "Ejecutar / Correr", original: "Run", phonetic: "Ran", example: "Run the script in terminal." },
                            { spanish: "Desplegar / Publicar web", original: "Deploy", phonetic: "Di-ploi", example: "Deploy the app to production." },
                            { spanish: "Depurar / Corregir errores", original: "Debug", phonetic: "Di-bag", example: "Debug the source code carefully." },
                            { spanish: "Obtener / Traer datos", original: "Fetch", phonetic: "Féch", example: "Fetch data from the API endpoint." },
                            { spanish: "Actualizar", original: "Update", phonetic: "Ap-déit", example: "Update dependencies regularly." }
                        ]
                    },
                    {
                        name: "Frases de Saludo",
                        cards: [
                            { spanish: "Buenos días", original: "Good morning", phonetic: "Gud mórning", example: "Good morning, let's start." },
                            { spanish: "¿Cómo estás?", original: "How are you?", phonetic: "Jao ar iu?", example: "Hello friend, how are you?" },
                            { spanish: "Muchas gracias", original: "Thank you very much", phonetic: "Tenk iu veri mach", example: "Thank you very much for your support." },
                            { spanish: "Nos vemos mañana", original: "See you tomorrow", phonetic: "Si iu tumorou", example: "Goodbye, see you tomorrow." }
                        ]
                    }
                ]
            },
            he: {
                name: "Hebreo",
                modules: [
                    {
                        name: "Alfabeto (Primeras Letras)",
                        cards: [
                            { spanish: "Alef (Soporte de vocal)", original: "א", phonetic: "Alef (Silenciosa)", example: "Es la 1° letra del Alef-Bet." },
                            { spanish: "Bet / Vet (B o V)", original: "ב", phonetic: "Bet (Con punto = B / Sin punto = V)", example: "Bayit significa Casa." },
                            { spanish: "Letra G (Como 'gato')", original: "ג", phonetic: "Guímel", example: "Gam significa También." },
                            { spanish: "Letra D (Como 'dado')", original: "ד", phonetic: "Dálet", example: "Davar significa Palabra o Cosa." },
                            { spanish: "Letra H (Suave como 'j')", original: "ה", phonetic: "Hei", example: "Har significa Montaña." }
                        ]
                    },
                    {
                        name: "Palabras Cotidianas",
                        cards: [
                            { spanish: "Hola / Paz / Adiós", original: "שלום", phonetic: "Shalom", example: "Shalom, ¿cómo estás?" },
                            { spanish: "Gracias", original: "תודה", phonetic: "Todá", example: "Todá rabah (Muchas gracias)." },
                            { spanish: "Sí", original: "כן", phonetic: "Ken", example: "Ken, yo entiendo." },
                            { spanish: "No", original: "לא", phonetic: "Lo", example: "Lo, gracias." }
                        ]
                    }
                ]
            }
        };

        let currentLang = 'en';
        let currentModuleIndex = 0;
        let currentCardIndex = 0;

        const langBtns = document.querySelectorAll('.lang-btn');
        const moduleNav = document.getElementById('moduleNav');
        const themeToggle = document.getElementById('themeToggle');
        const studyCard = document.getElementById('studyCard');

        const wordSpanish = document.getElementById('wordSpanish');
        const wordOriginal = document.getElementById('wordOriginal');
        const wordPhonetic = document.getElementById('wordPhonetic');
        const wordExample = document.getElementById('wordExample');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const speakBtn = document.getElementById('speakBtn');

        function initApp() {
            renderModuleNav();
            loadCard();
            setupEvents();
        }

        function renderModuleNav() {
            moduleNav.innerHTML = '';
            database[currentLang].modules.forEach((mod, idx) => {
                const btn = document.createElement('button');
                btn.className = `module-tab ${idx === currentModuleIndex ? 'active' : ''}`;
                btn.textContent = mod.name;
                btn.onclick = () => {
                    currentModuleIndex = idx;
                    currentCardIndex = 0;
                    renderModuleNav();
                    loadCardWithAnimation();
                };
                moduleNav.appendChild(btn);
            });
        }

        // FUNCIÓN PARA REINICIAR LA ANIMACIÓN SUAVE AL CAMBIAR DE TARJETA
        function loadCardWithAnimation() {
            studyCard.style.animation = 'none';
            studyCard.offsetHeight; // Truco para reiniciar el reflow de CSS
            studyCard.style.animation = 'fadeInSlide 0.35s ease-out';
            loadCard();
        }

        function loadCard() {
            const card = database[currentLang].modules[currentModuleIndex].cards[currentCardIndex];
            
            wordSpanish.textContent = card.spanish;
            wordOriginal.textContent = card.original;
            wordPhonetic.textContent = card.phonetic;
            wordExample.textContent = `"${card.example}"`;

            if (currentLang === 'he') {
                wordOriginal.classList.add('hebrew');
            } else {
                wordOriginal.classList.remove('hebrew');
            }
        }

        function setupEvents() {
            langBtns.forEach(btn => {
                btn.onclick = (e) => {
                    langBtns.forEach(b => b.classList.remove('active'));
                    const target = e.currentTarget;
                    target.classList.add('active');
                    currentLang = target.getAttribute('data-lang');
                    currentModuleIndex = 0;
                    currentCardIndex = 0;
                    renderModuleNav();
                    loadCardWithAnimation();
                };
            });

            nextBtn.onclick = () => {
                const totalCards = database[currentLang].modules[currentModuleIndex].cards.length;
                currentCardIndex = (currentCardIndex + 1) % totalCards;
                loadCardWithAnimation();
            };

            prevBtn.onclick = () => {
                const totalCards = database[currentLang].modules[currentModuleIndex].cards.length;
                currentCardIndex = (currentCardIndex - 1 + totalCards) % totalCards;
                loadCardWithAnimation();
            };

            speakBtn.onclick = () => {
                const card = database[currentLang].modules[currentModuleIndex].cards[currentCardIndex];
                const utterance = new SpeechSynthesisUtterance(card.original);
                utterance.lang = currentLang === 'en' ? 'en-US' : 'he-IL';
                window.speechSynthesis.speak(utterance);
            };

            themeToggle.onclick = () => {
                const body = document.body;
                if (body.getAttribute('data-theme') === 'light') {
                    body.setAttribute('data-theme', 'dark');
                    themeToggle.textContent = '☀️';
                } else {
                    body.setAttribute('data-theme', 'light');
                    themeToggle.textContent = '🌙';
                }
            };
        }

        window.onload = initApp;
    </script>
</body>
</html>
